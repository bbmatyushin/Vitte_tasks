<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Анализатор расходов{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .flash { padding: 10px; margin: 20px 0; border-radius: 5px; }
        .flash.success { background-color: #d4edda; color: #155724; }
        .flash.error { background-color: #f8d7da; color: #721c24; }
        .flash.warning { background-color: #fff3cd; color: #856404; }
        form { margin: 20px 0; }
        label { display: block; margin-bottom: 5px; }
        input[type="submit"], select { padding: 8px; margin: 5px 0; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
    {% block style %}{% endblock %}
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-0">Анализ расходов</h1>

        <div class="d-flex align-items-center mb-3">
            <!-- Форма для очистки кэша (POST запрос) -->
            <form method="post" action="{{ url_for('main.clear_cache') }}" class="me-2">
                <button type="submit" class="btn btn-custom-light-gray btn-sm">Очистить кеш</button>
            </form>

            <!-- Ссылка для перехода на страницу статуса (GET запрос) -->
            <!-- Используем класс btn-link для стилизации как кнопки -->
            <a href="{{ url_for('main.status') }}" class="btn btn-custom-light-gray btn-sm">Статус</a>
        </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
    {% block js %}{% endblock %}
</body>
</html>
